<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tracking Community – Apri link</title>
  <style>
    body { font-family: system-ui, sans-serif; padding: 2rem; text-align: center; }
    p { color: #374151; }
    a { color: #2563eb; }
  </style>
</head>
<body>
  <div id="content">
    <p id="msg"></p>
    <p><a id="openLink" href="" style="display:inline-block;margin:12px 0;padding:10px 20px;background:#f5c518;color:#111;font-weight:700;text-decoration:none;border-radius:8px;">Apri con Tracking Community</a></p>
    <p><button type="button" id="copyBtn" style="display:none;margin:8px 0;padding:8px 16px;background:#e5e7eb;color:#374151;font-weight:600;border:1px solid #d1d5db;border-radius:8px;cursor:pointer;">Copia link diretto</button></p>
    <p id="copyFeedback" style="display:none;font-size:14px;color:#059669;margin-top:4px;">Link copiato! Incollalo nella barra degli indirizzi e premi Invio.</p>
    <p id="adblockHint" style="display:none;font-size:12px;color:#6b7280;margin-top:12px;max-width:320px;margin-left:auto;margin-right:auto;">Se il link non si apre (ERR_BLOCKED_BY_CLIENT), il tuo blocca-annunci lo sta bloccando. Disattivalo temporaneamente o aggiungi un'eccezione per questa pagina.</p>
    <p><a id="store" href="">Installa l'estensione</a></p>
  </div>
  <script>
    (function () {
      var EXT_ID = "egjldedkojndhijaojofldliphmemglg";
      var STORE = "https://chromewebstore.google.com/detail/Series%20Tracker/" + EXT_ID;
      var params = new URLSearchParams(window.location.search);
      var movie = params.get("movie");
      var tv = params.get("tv");
      var s = params.get("s");
      var e = params.get("e");
      var protocolUrl = "";
      var directUrl = "";

      if (movie && /^\d+$/.test(movie)) {
        protocolUrl = "ext+trackingcommunity://movie/" + movie;
        directUrl = "chrome-extension://" + EXT_ID + "/tracker.html#movie/" + movie;
      } else if (tv && /^\d+$/.test(tv)) {
        if (s && e && /^\d+$/.test(s) && /^\d+$/.test(e)) {
          protocolUrl = "ext+trackingcommunity://tv/" + tv + "/s/" + s + "/e/" + e;
          directUrl = "chrome-extension://" + EXT_ID + "/tracker.html#tv/" + tv + "/s/" + s + "/e/" + e;
        } else {
          protocolUrl = "ext+trackingcommunity://tv/" + tv;
          directUrl = "chrome-extension://" + EXT_ID + "/tracker.html#tv/" + tv;
        }
      }

      var storeEl = document.getElementById("store");
      var msgEl = document.getElementById("msg");
      var openLink = document.getElementById("openLink");
      var copyBtn = document.getElementById("copyBtn");
      var copyFeedback = document.getElementById("copyFeedback");
      storeEl.href = STORE;

      if (protocolUrl) {
        msgEl.textContent = "Se hai l'estensione: copia il link qui sotto e incollalo nella barra degli indirizzi di Chrome.";
        openLink.href = protocolUrl;
        openLink.style.display = "inline-block";
        copyBtn.style.display = "inline-block";
        document.getElementById("adblockHint").style.display = "block";
        copyBtn.addEventListener("click", function () {
          navigator.clipboard.writeText(directUrl).then(function () {
            copyFeedback.style.display = "block";
            setTimeout(function () { copyFeedback.style.display = "none"; }, 4000);
          });
        });
      } else {
        msgEl.textContent = "Link non valido.";
        openLink.style.display = "none";
        setTimeout(function () { window.location = STORE; }, 2500);
      }
    })();
  </script>
</body>
</html>
