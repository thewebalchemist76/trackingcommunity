<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tracking Community – Apri link</title>
  <style>
    body { font-family: system-ui, sans-serif; padding: 2rem; text-align: center; }
    p { color: #374151; }
    a { color: #2563eb; }
  </style>
</head>
<body>
  <div id="content">
    <p id="msg"></p>
    <p><a id="openLink" href="" style="display:inline-block;margin:12px 0;padding:10px 20px;background:#f5c518;color:#111;font-weight:700;text-decoration:none;border-radius:8px;">Apri con Tracking Community</a></p>
    <p><a id="store" href="">Installa l'estensione</a></p>
  </div>
  <script>
    (function () {
      var EXT_ID = "egjldedkojndhijaojofldliphmemglg";
      var STORE = "https://chromewebstore.google.com/detail/Series%20Tracker/" + EXT_ID;
      var params = new URLSearchParams(window.location.search);
      var movie = params.get("movie");
      var tv = params.get("tv");
      var s = params.get("s");
      var e = params.get("e");
      var protocolUrl = "";

      if (movie && /^\d+$/.test(movie)) {
        protocolUrl = "ext+trackingcommunity://movie/" + movie;
      } else if (tv && /^\d+$/.test(tv)) {
        if (s && e && /^\d+$/.test(s) && /^\d+$/.test(e)) {
          protocolUrl = "ext+trackingcommunity://tv/" + tv + "/s/" + s + "/e/" + e;
        } else {
          protocolUrl = "ext+trackingcommunity://tv/" + tv;
        }
      }

      var storeEl = document.getElementById("store");
      var msgEl = document.getElementById("msg");
      var openLink = document.getElementById("openLink");
      storeEl.href = STORE;

      if (protocolUrl) {
        msgEl.textContent = "Clicca il pulsante per aprire il titolo in Tracking Community:";
        openLink.href = protocolUrl;
        openLink.style.display = "inline-block";
      } else {
        msgEl.textContent = "Link non valido.";
        openLink.style.display = "none";
        setTimeout(function () { window.location = STORE; }, 2500);
      }
    })();
  </script>
</body>
</html>
