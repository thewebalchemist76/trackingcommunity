<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tracking Community – Apri link</title>
  <style>
    body { font-family: system-ui, sans-serif; padding: 2rem; text-align: center; }
    p { color: #374151; }
    a { color: #2563eb; }
  </style>
</head>
<body>
  <p id="msg">Apertura in corso…</p>
  <p><a id="store" href="">Installa l'estensione</a></p>
  <script>
    (function () {
      var STORE = "https://chromewebstore.google.com/detail/Series%20Tracker/egjldedkojndhijaojofldliphmemglg";
      var params = new URLSearchParams(window.location.search);
      var movie = params.get("movie");
      var tv = params.get("tv");
      var s = params.get("s");
      var e = params.get("e");
      var protocol = "";

      if (movie && /^\d+$/.test(movie)) {
        protocol = "web+trackingcommunity://movie/" + movie;
      } else if (tv && /^\d+$/.test(tv)) {
        if (s && e && /^\d+$/.test(s) && /^\d+$/.test(e)) {
          protocol = "web+trackingcommunity://tv/" + tv + "/s/" + s + "/e/" + e;
        } else {
          protocol = "web+trackingcommunity://tv/" + tv;
        }
      }

      var storeEl = document.getElementById("store");
      var msgEl = document.getElementById("msg");
      storeEl.href = STORE;

      if (protocol) {
        window.location = protocol;
        setTimeout(function () {
          msgEl.textContent = "Se l'estensione non si è aperta, installala dal link qui sotto.";
        }, 1800);
        setTimeout(function () {
          window.location = STORE;
        }, 2200);
      } else {
        msgEl.textContent = "Link non valido.";
        setTimeout(function () { window.location = STORE; }, 2500);
      }
    })();
  </script>
</body>
</html>
